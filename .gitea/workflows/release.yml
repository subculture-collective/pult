name: release

# Builds the release files when a tag like v0.1.0 is pushed: tarballs for
# Linux and macOS with the catalog built in, the source tarball, the
# catalog, checksums, and the filled AUR and Homebrew files, then publishes
# the npm packages. See docs/runbooks/release.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tag is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" FETCH_HEAD; then
            echo "${GITHUB_REF_NAME} points at a commit that is not on main" >&2
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify
        run: make verify
      - name: Build the catalog from the pinned sources
        run: |
          make catalog
          cp .cache/catalog.db.zst builtin/catalog.db.zst
      - name: Build the release files
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          scripts/dist.sh "${version}" "${GITHUB_REF_NAME}"
          scripts/render-packaging.sh "${version}" "${{ github.server_url }}/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}"
          cp dist/packaging/aur/pult/PKGBUILD "dist/PKGBUILD.pult"
          cp dist/packaging/aur/pult-bin/PKGBUILD "dist/PKGBUILD.pult-bin"
          cp dist/packaging/homebrew/pult.rb dist/pult.rb
      - name: Publish the release
        env:
          TOKEN: ${{ github.token }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          set -euo pipefail
          body=$(python3 -c 'import json, os; t = os.environ["GITHUB_REF_NAME"]; print(json.dumps({"tag_name": t, "name": "Pult " + t[1:]}))')
          id=$(curl -fsS -X POST -H "Authorization: token ${TOKEN}" -H "Content-Type: application/json" \
            -d "${body}" "${API}/releases" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          for f in dist/pult-* dist/PKGBUILD.* dist/pult.rb; do
            curl -fsS -X POST -H "Authorization: token ${TOKEN}" -F "attachment=@${f}" \
              "${API}/releases/${id}/assets?name=$(basename "${f}")" > /dev/null
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The npm packages: one per platform holding the binary from the
      # tarballs above, and @subcult/pult, the launcher. Needs the NPM_TOKEN
      # secret, an npm token that may publish to the @subcult scope.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::warning::NPM_TOKEN is not set; the npm packages were not published (docs/runbooks/release.md)"
            exit 0
          fi
          scripts/publish-npm.sh "${GITHUB_REF_NAME#v}"

  # The pult pacman package, built from the release's PKGBUILD and
  # uploaded to the Gitea pacman repository "subcult". The Actions token may
  # not publish packages (401 reqPackageAccess), so this needs the
  # ARCH_PACKAGE_TOKEN secret: a token with package write access.
  arch:
    needs: release
    timeout-minutes: 45
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    defaults:
      run:
        shell: bash
    steps:
      # The Arch image has no Node for actions/checkout; fetch the script
      # at this commit instead.
      - name: Fetch the publish script
        run: curl -fsSL "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/raw/scripts/publish-arch.sh?ref=${GITHUB_SHA}" -o /tmp/publish-arch.sh
      - name: Build and upload the package
        env:
          GITEA_TOKEN: ${{ secrets.ARCH_PACKAGE_TOKEN }}
        run: |
          if [ -z "${GITEA_TOKEN}" ]; then
            echo "::warning::ARCH_PACKAGE_TOKEN is not set; the pacman package was not published (docs/runbooks/release.md)"
            exit 0
          fi
          bash /tmp/publish-arch.sh "${GITHUB_REF_NAME#v}"
