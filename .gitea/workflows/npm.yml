name: npm

# Publishes an existing release's npm packages, for releases made before
# release.yml did it, or to retry. Run it from the Actions tab with the
# version (without "v"). It needs the NPM_TOKEN secret (see release.yml).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, such as 0.3.0"
        required: true

permissions:
  contents: read

jobs:
  npm:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must be X.Y.Z" >&2; exit 1; }
          FETCH=1 scripts/publish-npm.sh "$VERSION"
