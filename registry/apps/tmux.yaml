# Checked on Arch, tmux 3.8, 2026-11-06: version regex and validate. The
# validate command sources only the theme file on a private server, which
# exits at once; it fails on unknown options and bad styles. "source-file -n"
# does not catch either, so it is not used.
schema: 1
id: tmux
name: tmux
homepage: https://github.com/tmux/tmux
platforms: [linux, macos]
tier: 1

detect:
  binaries: [tmux]
  version:
    argv: [tmux, -V]
    regex: 'tmux (?:next-)?([0-9.]+)'

config:
  paths:
    # tmux loads every file in TMUX_CONF that exists: ~/.tmux.conf, then
    # $XDG_CONFIG_HOME/tmux/tmux.conf, then ~/.config/tmux/tmux.conf, later
    # ones winning (Makefile.am, tmux.c expand_paths; tmux a73616d,
    # 2026-11-07). Reverse order, so the include lands in the file read last.
    linux: &paths ["$HOME/.config/tmux/tmux.conf", "$XDG_CONFIG_HOME/tmux/tmux.conf", "$HOME/.tmux.conf"]
    macos: *paths

integrations:
  - method: include
    template: tmux/pult.conf.mustache
    owned_file: "$XDG_CONFIG_HOME/tmux/pult.conf"
    line: 'source-file -q "{theme_file}"'
    position: end

reload:
  - argv: [tmux, source-file, "{theme_file}"]
    when: running
validate:
  argv: [tmux, -L, pult-validate, -f, /dev/null, start-server, ";", source-file, "{theme_file}"]

ports:
  catppuccin: { url: https://github.com/catppuccin/tmux, kind: official }
  dracula: { url: https://github.com/dracula/tmux, kind: official }
