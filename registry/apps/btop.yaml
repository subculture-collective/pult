# Checked on Arch, btop 1.4.7, 2026-11-06: version regex (btop prints ANSI
# bold around the number) and the color_theme setting. The SIGUSR2 reload is
# the one omarchy-restart-btop uses. btop has no validate command. There is
# no dracula/btop repository.
schema: 1
id: btop
name: btop
homepage: https://github.com/aristocratos/btop
platforms: [linux, macos]
tier: 1

detect:
  binaries: [btop]
  version:
    argv: [btop, --version]
    regex: 'btop version: (?:\x1b\[[0-9;]*m)?([0-9.]+)'

config:
  paths:
    linux: ["$XDG_CONFIG_HOME/btop/btop.conf"]
    macos: ["$XDG_CONFIG_HOME/btop/btop.conf"]

integrations:
  # Catppuccin's official btop themes, for the four official flavors
  # (catppuccin/btop f437574, MIT, hashes taken 2026-11-07). Other themes,
  # or a failed download, use the generated theme below.
  - method: port
    url: https://github.com/catppuccin/btop
    revision: f437574b600f1c6d932627050b15ff5153b58fa3
    flavors:
      catppuccin-latte: { path: themes/catppuccin_latte.theme, sha256: 90e963ead5ee083a1359dcb694d9784c1bfe41ec2e0d486d3b04f0d9bdb9173b }
      catppuccin-frappe: { path: themes/catppuccin_frappe.theme, sha256: 1689b67c1c6ce2f4985a0047fad6535acecf7872c21963785fa749868a01a2c9 }
      catppuccin-macchiato: { path: themes/catppuccin_macchiato.theme, sha256: f8b18ccb217bd4ebc184806a91d49a12cb312b9cf37d8ba23322653a78ac8850 }
      catppuccin-mocha: { path: themes/catppuccin_mocha.theme, sha256: 4c7469ab9bda282c1ff606aca37c9c0b84cd0cb66d041e4e7e1fed39791f4644 }
    target: themes/pult.theme
    select:
      format: ini
      set: { color_theme: pult }
  - method: owned
    template: btop/pult.theme.mustache
    target: themes/pult.theme
    select:
      format: ini
      set: { color_theme: pult }
  # btop's built-in TTY theme uses the terminal's 16 colors.
  - method: ansi
    format: ini
    set: { color_theme: TTY }

reload:
  - argv: [pkill, -USR2, -x, btop]
    when: running
    platforms: [linux]

ports:
  catppuccin: { url: https://github.com/catppuccin/btop, kind: official }
