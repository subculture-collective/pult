# Checked on Arch, yazi 26.9.1, 2026-11-06: version regex. Older releases
# print "Yazi 0.4.2 (...)". Yazi loads flavors at start, so there is no
# reload; settings in the user's own theme.toml still win over the flavor.
schema: 1
id: yazi
name: Yazi
homepage: https://yazi-rs.github.io/
platforms: [linux, macos]
tier: 1

detect:
  binaries: [yazi]
  version:
    argv: [yazi, --version]
    regex: '(?:Yazi |Version: )([0-9.]+)'

config:
  env:
    - { name: YAZI_CONFIG_HOME, kind: dir }
  paths:
    linux: ["$XDG_CONFIG_HOME/yazi/theme.toml"]
    macos: ["$HOME/.config/yazi/theme.toml"]

integrations:
  # 0.4 replaced flavor.use with separate dark and light flavors.
  - method: owned
    versions: ">=0.4"
    template: yazi/flavor.toml.mustache
    target: flavors/theme-tender.yazi/flavor.toml
    select:
      format: toml
      set: { flavor.dark: theme-tender, flavor.light: theme-tender }
  - method: owned
    versions: "<0.4"
    template: yazi/flavor.toml.mustache
    target: flavors/theme-tender.yazi/flavor.toml
    select:
      format: toml
      set: { flavor.use: theme-tender }

ports:
  catppuccin: { url: https://github.com/catppuccin/yazi, kind: official }
  dracula: { url: https://github.com/dracula/yazi, kind: official }
