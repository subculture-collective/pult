# Checked on Arch, yazi 26.9.1, 2026-11-06: version regex, and that Yazi
# starts with the generated flavor. Yazi also starts with invalid values,
# so that check proves little; the flavor's keys follow catppuccin/yazi.
# Older releases print "Yazi 0.4.2 (...)". Yazi loads flavors at start, so
# there is no reload; settings in the user's own theme.toml still win over
# the flavor.
schema: 1
id: yazi
name: Yazi
homepage: https://yazi-rs.github.io/
platforms: [linux, macos]
tier: 1

detect:
  binaries: [yazi]
  version:
    argv: [yazi, --version]
    regex: '(?:Yazi |Version: )([0-9.]+)'

config:
  env:
    - { name: YAZI_CONFIG_HOME, kind: dir }
  paths:
    linux: ["$XDG_CONFIG_HOME/yazi/theme.toml"]
    # yazi-fs/src/xdg.rs (yazi 6882e1a, 2026-11-07): $XDG_CONFIG_HOME/yazi,
    # else ~/.config/yazi, on macOS too.
    macos: ["$XDG_CONFIG_HOME/yazi/theme.toml"]

integrations:
  # 25.5.28 renamed the [manager] section to [mgr]; the flavor uses [mgr].
  - method: owned
    versions: ">=25.5.28"
    template: yazi/flavor.toml.mustache
    target: flavors/theme-tender.yazi/flavor.toml
    select:
      format: toml
      set: { flavor.dark: theme-tender, flavor.light: theme-tender }
  - method: manual
    url: https://yazi-rs.github.io/docs/flavors/overview

ports:
  catppuccin: { url: https://github.com/catppuccin/yazi, kind: official }
  dracula: { url: https://github.com/dracula/yazi, kind: official }
