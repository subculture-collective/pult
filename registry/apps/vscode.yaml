# From VS Code's Themes, Settings and Theme Color documentation, read
# 2026-11-16. User settings are JSONC and reload live. No extension is
# installed. Only the default profile is edited; workspace and named-profile
# overrides can take precedence. Native application verification is separate.
schema: 1
id: vscode
name: Visual Studio Code
homepage: https://code.visualstudio.com/
platforms: [linux, macos]
tier: 1

detect:
  binaries: [code]
  macos_apps: [Visual Studio Code.app]
  version:
    argv: [code, --version]
    regex: '([0-9]+\.[0-9]+\.[0-9]+)'

config:
  paths:
    linux: ["$XDG_CONFIG_HOME/Code/User/settings.json"]
    macos: ["$MAC_CONFIG_HOME/Code/User/settings.json"]

integrations:
  - method: keys
    versions: ">=1.78"
    format: jsonc
    template: vscode/settings.json.mustache
    paths:
      - "/workbench.colorTheme"
      - "/workbench.colorCustomizations/focusBorder"
      - "/workbench.colorCustomizations/foreground"
      - "/workbench.colorCustomizations/descriptionForeground"
      - "/workbench.colorCustomizations/errorForeground"
      - "/workbench.colorCustomizations/textLink.foreground"
      - "/workbench.colorCustomizations/textLink.activeForeground"
      - "/workbench.colorCustomizations/selection.background"
      - "/workbench.colorCustomizations/editor.background"
      - "/workbench.colorCustomizations/editor.foreground"
      - "/workbench.colorCustomizations/editorCursor.foreground"
      - "/workbench.colorCustomizations/editor.selectionBackground"
      - "/workbench.colorCustomizations/editor.selectionForeground"
      - "/workbench.colorCustomizations/editorLineNumber.foreground"
      - "/workbench.colorCustomizations/editorLineNumber.activeForeground"
      - "/workbench.colorCustomizations/editorError.foreground"
      - "/workbench.colorCustomizations/editorWarning.foreground"
      - "/workbench.colorCustomizations/editorInfo.foreground"
      - "/workbench.colorCustomizations/sideBar.background"
      - "/workbench.colorCustomizations/sideBar.foreground"
      - "/workbench.colorCustomizations/sideBarTitle.foreground"
      - "/workbench.colorCustomizations/activityBar.background"
      - "/workbench.colorCustomizations/activityBar.foreground"
      - "/workbench.colorCustomizations/activityBar.inactiveForeground"
      - "/workbench.colorCustomizations/statusBar.background"
      - "/workbench.colorCustomizations/statusBar.foreground"
      - "/workbench.colorCustomizations/statusBar.debuggingBackground"
      - "/workbench.colorCustomizations/statusBar.debuggingForeground"
      - "/workbench.colorCustomizations/panel.background"
      - "/workbench.colorCustomizations/panel.border"
