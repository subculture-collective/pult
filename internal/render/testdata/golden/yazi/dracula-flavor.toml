# Generated by Theme Tender from Dracula. Theme Tender replaces this file on every apply.
# Written for Yazi 25.5.28 and later, which use [mgr] instead of [manager].
# Keys and rule syntax follow the catppuccin/yazi port for current Yazi.

[mgr]
cwd = { fg = "#a4ffff" }
find_keyword = { fg = "#ffffa5", italic = true }
find_position = { fg = "#ff92df", bg = "reset", italic = true }
marker_copied = { fg = "#69ff94", bg = "#69ff94" }
marker_cut = { fg = "#ff6e6e", bg = "#ff6e6e" }
marker_marked = { fg = "#a4ffff", bg = "#a4ffff" }
marker_selected = { fg = "#d6acff", bg = "#d6acff" }
count_copied = { fg = "#282a36", bg = "#69ff94" }
count_cut = { fg = "#282a36", bg = "#ff6e6e" }
count_selected = { fg = "#282a36", bg = "#d6acff" }
border_symbol = "│"
border_style = { fg = "#949f9c" }

[tabs]
active = { fg = "#282a36", bg = "#f8f8f2", bold = true }
inactive = { fg = "#f8f8f2", bg = "#505c63" }

[mode]
normal_main = { fg = "#282a36", bg = "#d6acff", bold = true }
normal_alt = { fg = "#d6acff", bg = "#3d454f" }
select_main = { fg = "#282a36", bg = "#69ff94", bold = true }
select_alt = { fg = "#69ff94", bg = "#3d454f" }
unset_main = { fg = "#282a36", bg = "#ffd4cd", bold = true }
unset_alt = { fg = "#ffd4cd", bg = "#3d454f" }

[status]
overall = { fg = "#f8f8f2", bg = "#20222d" }
progress_label = { fg = "#f8f8f2", bold = true }
progress_normal = { fg = "#69ff94", bg = "#505c63" }
progress_error = { fg = "#ffffa5", bg = "#ff6e6e" }
perm_type = { fg = "#d6acff" }
perm_read = { fg = "#ffffa5" }
perm_write = { fg = "#ff6e6e" }
perm_exec = { fg = "#69ff94" }
perm_sep = { fg = "#949f9c" }

[input]
border = { fg = "#d6acff" }
selected = { reversed = true }

[pick]
border = { fg = "#d6acff" }
active = { fg = "#ff92df" }

[confirm]
border = { fg = "#d6acff" }
title = { fg = "#d6acff" }
btn_yes = { reversed = true }

[cmp]
border = { fg = "#d6acff" }

[tasks]
border = { fg = "#d6acff" }
hovered = { fg = "#ff92df", bold = true }

[which]
border = { fg = "#d6acff" }
cand = { fg = "#a4ffff" }
rest = { fg = "#acb5b0" }
desc = { fg = "#ff92df" }
separator_style = { fg = "#657275" }

[help]
border = { fg = "#d6acff" }
chord = { fg = "#a4ffff" }
action = { fg = "#acb5b0" }
hovered = { bg = "#657275", bold = true }

[notify]
title_info = { fg = "#a4ffff" }
title_warn = { fg = "#ffffa5" }
title_error = { fg = "#ff6e6e" }

[filetype]
rules = [
  { mime = "**/image/*", fg = "#ffffa5" },
  { mime = "**/{audio,video}/*", fg = "#ff92df" },
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ff6e6e" },
  { mime = "**/application/{pdf,doc,rtf}", fg = "#b2dfff" },
  { url = "*", is = "orphan", bg = "#ff6e6e" },
  { url = "*", is = "exec", fg = "#69ff94" },
  { url = "*/", fg = "#d6acff" },
]
